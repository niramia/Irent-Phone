<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - iRent Phone</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="brand-header">
      <div class="logo-icon">i</div>
      <h2>iRent Phone</h2>
      <p style="font-size:0.85rem; color:#64748b; margin-top:4px;">Masuk ke Panel Admin</p>
    </div>

    <div id="errorMsg" class="error-msg">Username dan password wajib diisi!</div>

    <!-- Form langsung terhubung mengarahkan ke dashboard admin -->
    <form id="loginForm" action="../admin/dashboard.html" method="GET">
      <div class="form-group">
        <label for="username">Username / Email</label>
        <input type="text" id="username" class="form-control" placeholder="Masukkan username admin" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-login">Masuk ke Dashboard</button>
    </form>

    <a href="beranda.html" class="back-link">&larr; Kembali ke Beranda</a>
  </div>

  <script src="../../assets/js/main.js"></script>
</body>
</html>
